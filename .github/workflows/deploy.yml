name: Deploy to Fly.io

on:
  push:
    branches:
      - claude/analyze-openclaw-architecture-WILUy

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: superfly/flyctl-actions/setup-flyctl@1.5
        with:
          version: '0.2.87'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate pnpm lockfile
        working-directory: orca
        run: corepack enable && corepack prepare pnpm@10.23.0 --activate && pnpm install --lockfile-only

      - name: Deploy
        working-directory: orca
        run: flyctl deploy --app orca-1
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
