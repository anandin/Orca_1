# Orca Gateway — Fly.io deployment
# Deploy: fly deploy --app orca-1
# Required secrets:
#   fly secrets set OPENCLAW_GATEWAY_TOKEN=<random-hex>  # internal WS auth token
#   fly secrets set OPENCLAW_ADMIN_EMAIL=you@example.com  # login form email
#   fly secrets set OPENCLAW_ADMIN_PASSWORD=<strong-pass>  # login form password
#   fly secrets set OPENAI_API_KEY=sk-...
#   fly secrets set SAMSKARA_API_KEY=sk_...

app = "orca-1"
primary_region = "iad" # Change to your closest: sjc, iad, lhr, nrt, syd

[build]
  dockerfile = "Dockerfile"

  [build.args]
    OPENCLAW_INSTALL_BROWSER = "0"
    OPENCLAW_INSTALL_DOCKER_CLI = "0"

[env]
  NODE_ENV = "production"
  OPENCLAW_PREFER_PNPM = "1"
  OPENCLAW_STATE_DIR = "/data"
  OPENCLAW_CONFIG_PATH = "/app/orca-config/openclaw.json"
  NODE_OPTIONS = "--max-old-space-size=384"
  # Samskara agent ID (registered at samskara-mind.replit.app)
  SAMSKARA_AGENT_ID = "orca-v1"

[processes]
  app = "node openclaw.mjs gateway --allow-unconfigured --port 3000 --bind lan --auth token"

[[files]]
  guest_path = "/app/orca-config/openclaw.json"
  raw_value = "{\"gateway\":{\"controlUi\":{\"dangerouslyAllowHostHeaderOriginFallback\":true,\"dangerouslyDisableDeviceAuth\":true}}}"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false # Keep alive for persistent channel connections
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[mounts]
  source = "orca_data"
  destination = "/data"
