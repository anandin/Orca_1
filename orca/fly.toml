# Orca Gateway — Fly.io deployment
# Deploy: fly deploy --app orca-1
# Secrets: fly secrets set OPENAI_API_KEY=sk-... SAMSKARA_API_KEY=sk_... ORCA_GATEWAY_TOKEN=...

app = "orca-1"
primary_region = "sjc" # Change to your closest: sjc, iad, lhr, nrt, syd

[build]
  dockerfile = "Dockerfile"

  [build.args]
    OPENCLAW_INSTALL_BROWSER = "0"
    OPENCLAW_INSTALL_DOCKER_CLI = "0"

[env]
  NODE_ENV = "production"
  OPENCLAW_PREFER_PNPM = "1"
  OPENCLAW_STATE_DIR = "/data"
  OPENCLAW_CONFIG_PATH = "/app/orca-config/openclaw.json"
  NODE_OPTIONS = "--max-old-space-size=1536"
  # Samskara agent ID (registered at samskara-mind.replit.app)
  SAMSKARA_AGENT_ID = "orca-v1"

[processes]
  app = "node openclaw.mjs gateway --allow-unconfigured --port 3000 --bind lan --auth token"

[[files]]
  guest_path = "/app/orca-config/openclaw.json"
  raw_value = "{\"gateway\":{\"controlUi\":{\"dangerouslyAllowHostHeaderOriginFallback\":true}}}"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false # Keep alive for persistent channel connections
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2048mb"

[mounts]
  source = "orca_data"
  destination = "/data"
